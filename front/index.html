<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>QWERTY Chat — Script Analyzer (Frontend)</title>
    <link rel="stylesheet" href="index.css" />
</head>
<body>
    <section id="loaderMain" class="loader__main">

        <span id="loader" class="loader"></span>
        <h4 id="welcome">Добро Пожаловать!</h4>
    </section>
 
<div class="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar hidden">
        <div class="sidebar-header">
            <h2>Чаты</h2>
            <div class="sidebar-controls">
               

                <button  id="new-chat" title="Новый чат"><svg width="10px" height="10px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M13 3C13 2.44772 12.5523 2 12 2C11.4477 2 11 2.44772 11 3V11H3C2.44772 11 2 11.4477 2 12C2 12.5523 2.44772 13 3 13H11V21C11 21.5523 11.4477 22 12 22C12.5523 22 13 21.5523 13 21V13H21C21.5523 13 22 12.5523 22 12C22 11.4477 21.5523 11 21 11H13V3Z" fill="#0F0F0F"/>
</svg></button>
                <button id="clear-all" title="Очистить всё"><svg xmlns="http://www.w3.org/2000/svg" width="15px" height="15px" viewBox="0 0 24 24" fill="none"><path d="M4.99997 8H6.5M6.5 8V18C6.5 19.1046 7.39543 20 8.5 20H15.5C16.6046 20 17.5 19.1046 17.5 18V8M6.5 8H17.5M17.5 8H19M9 5H15M9.99997 11.5V16.5M14 11.5V16.5" stroke="#000" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
        </div>
        <ul id="chat-list"></ul>
    </aside>

    <!-- Main area -->
    <div class="chat-container">
        <header class="chat-header">
            <div class="chat__logo">
                <button id="toggle-menu" class="menu-btn" title="Показать/скрыть меню">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25px" height="25px" viewBox="0 0 24 24" fill="none">
                    <path d="M4 18H10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                    <path d="M4 12L16 12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                    <path d="M4 6L20 6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                    </svg>
    
                </button>
                <h1 id="chat-title">QWERTY</h1>
            </div>
           
            <div class="header-actions">
                <a class="link__header" href="./rethink/index.html"> 
                    <p>Детальный анализ</p>
                    <div for="script-input" class="script-btn" title="Загрузить сценарий (.txt)">

                            </svg>
                        </div>
                  </a>
                <input id="script-input" type="file" accept=".txt" style="display:none;">
            </div>
        </header>

        <section id="chat-box" class="chat-box" tabindex="0"></section>

        <form id="chat-form" class="chat-form">
            <div class="left-controls">
                <label for="file-input" id="file-label" class="file-label" title="Прикрепить фото">
                    <span id="camera-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewBox="0 0 24 24" fill="none">
                            <g id="style=stroke">
                            <g id="attach">
                            <path id="vector (Stroke)" fill-rule="evenodd" clip-rule="evenodd" d="M17.3656 4.70536C16.2916 3.63142 14.5504 3.63142 13.4765 4.70536L5.34477 12.8371C3.68504 14.4968 3.68504 17.1878 5.34477 18.8475C7.0045 20.5072 9.69545 20.5072 11.3552 18.8475L20.1172 10.0855C20.41 9.79263 20.8849 9.79263 21.1778 10.0855C21.4707 10.3784 21.4707 10.8533 21.1778 11.1462L12.4158 19.9082C10.1703 22.1537 6.52963 22.1537 4.28411 19.9082C2.0386 17.6626 2.0386 14.0219 4.28411 11.7764L12.4158 3.6447C14.0756 1.98497 16.7665 1.98497 18.4262 3.6447C20.086 5.30443 20.086 7.99538 18.4262 9.65511L10.6327 17.4487C9.55876 18.5226 7.81756 18.5226 6.74361 17.4487C5.66967 16.3747 5.66967 14.6335 6.74361 13.5596L13.9377 6.36552C14.2305 6.07263 14.7054 6.07263 14.9983 6.36552C15.2912 6.65842 15.2912 7.13329 14.9983 7.42618L7.80427 14.6202C7.31612 15.1084 7.31612 15.8998 7.80427 16.388C8.29243 16.8761 9.08389 16.8761 9.57204 16.388L17.3656 8.59445C18.4395 7.5205 18.4395 5.7793 17.3656 4.70536Z" fill="#fff"/>
                            </g>
                            </g>
                            </svg>

                    </span>
                    <img id="thumb-preview" src="" alt="" style="display:none;">
                </label>
            </div>
            <input type="file" id="file-input" accept="image/*" hidden>
            <input type="text" id="user-input" placeholder="Введите сообщение..." autocomplete="off">
            <button type="submit"><svg xmlns="http://www.w3.org/2000/svg" width="15px" height="15px" viewBox="0 -0.5 25 25" fill="none">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M18.455 9.8834L7.063 4.1434C6.76535 3.96928 6.40109 3.95274 6.08888 4.09916C5.77667 4.24558 5.55647 4.53621 5.5 4.8764C5.5039 4.98942 5.53114 5.10041 5.58 5.2024L7.749 10.4424C7.85786 10.7903 7.91711 11.1519 7.925 11.5164C7.91714 11.8809 7.85789 12.2425 7.749 12.5904L5.58 17.8304C5.53114 17.9324 5.5039 18.0434 5.5 18.1564C5.55687 18.4961 5.77703 18.7862 6.0889 18.9323C6.40078 19.0785 6.76456 19.062 7.062 18.8884L18.455 13.1484C19.0903 12.8533 19.4967 12.2164 19.4967 11.5159C19.4967 10.8154 19.0903 10.1785 18.455 9.8834V9.8834Z" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg></button>
        </form>
    </div>
</div>
 
<!-- Modal rename -->
<div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal">
        <h3 id="modal-title">Переименовать чат</h3>
        <input id="modal-input" type="text" placeholder="Новое название чата">
        <div class="modal-actions">
            <button id="modal-cancel">Отмена</button>
            <button id="modal-ok">Сохранить</button>
        </div>
    </div>
</div>

<!-- Modal delete -->
<div id="delete-modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal">
        <h3>Удалить чат?</h3>
        <p id="delete-modal-text">Вы уверены, что хотите удалить этот чат? Действие необратимо.</p>
        <div class="modal-actions">
            <button id="delete-modal-cancel">Отмена</button>
            <button id="delete-modal-ok">Удалить</button>
        </div>
    </div>
</div>

<!-- Scene details modal (for editing / manual correction) -->
<div id="scene-modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal" style="width:700px; max-width:95%;">
        <h3 id="scene-modal-title">Сцена</h3>
        <textarea id="scene-modal-text" rows="10" style="width:100%;"></textarea>
        <div style="margin-top:10px; display:flex; justify-content:flex-end; gap:8px;">
            <button id="scene-modal-cancel">Отмена</button>
            <button id="scene-modal-save">Сохранить и переанализировать</button>
        </div>
    </div>
</div>

<script src="index.js"></script>
</body>
</html>
